services:
  - type: web
    name: parmanu-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_REGISTRATION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
